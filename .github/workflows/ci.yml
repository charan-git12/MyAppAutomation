name: MyApp Deployment CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-ci:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          $result = Invoke-Pester -Path .\Deploy-App.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }
          Write-Host "Passed tests: $($result.PassedCount)"

      - name: Run deployment and validate results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $transcriptPath = Join-Path $env:RUNNER_TEMP 'ci-transcript.log'
          $logPath = Join-Path $env:RUNNER_TEMP 'Logs\Deploy-App.log'
          $destinationPath = Join-Path $env:RUNNER_TEMP 'MyAppInstalled'
          $registryPath = 'HKCU:\Software\MyCompany\MyApp.CI'

          Start-Transcript -Path $transcriptPath -Force

          try {
            . "$env:GITHUB_WORKSPACE\Deploy-App.ps1"

            Invoke-MyAppDeployment `
              -SourcePath "$env:GITHUB_WORKSPACE\Source" `
              -DestinationPath $destinationPath `
              -RegistryPath $registryPath `
              -LogPath $logPath `
              -Version '1.0.0'

            $installedFile = Join-Path $destinationPath 'app.txt'
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw 'Validation failed: app.txt was not installed.'
            }

            $registry = Get-ItemProperty -LiteralPath $registryPath
            if ($registry.InstallPath -ne $destinationPath) {
              throw 'Validation failed: InstallPath registry value is incorrect.'
            }
            if ($registry.Version -ne '1.0.0') {
              throw 'Validation failed: Version registry value is incorrect.'
            }

            $logContent = Get-Content -LiteralPath $logPath -Raw
            if ($logContent -notmatch 'Deployment completed successfully') {
              throw 'Validation failed: success message is missing from the log.'
            }

            Write-Host 'Deployment and all validations succeeded.'
          }
          catch {
            Write-Error $_
            throw
          }
          finally {
            Stop-Transcript
            if (Test-Path -LiteralPath $registryPath) {
              Remove-Item -LiteralPath $registryPath -Recurse -Force
            }
          }

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            ${{ runner.temp }}\ci-transcript.log
            ${{ runner.temp }}\Logs\Deploy-App.log
          if-no-files-found: warn
